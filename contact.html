<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us | QuickCalc</title>
    <meta
      name="description"
      content="Contact QuickCalc — send feedback, report issues or request new calculators."
    />
    <meta name="keywords" content="contact quickcalc" />
    <link rel="canonical" href="https://quickcalc-tools.vercel.app/" />
    <meta property="og:title" content="Contact Us | QuickCalc" />
    <meta
      property="og:description"
      content="Contact QuickCalc — send feedback, report issues or request new calculators."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://quickcalc-tools.vercel.app/" />
    <meta name="twitter:card" content="summary" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧮</text></svg>"
    />
    <!-- Google AdSense: paste your script tag here after approval -->
    <!-- <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXX" crossorigin="anonymous"></script> -->
    <link rel="stylesheet" href="assets/site.css" />
  </head>
  <body>
    <header class="site">
      <div class="wrap bar">
        <a class="logo" href="/">Quick<span>Calc</span></a>
        <nav class="top">
          <a href="/">Home</a><a href="/about.html">About</a
          ><a href="/contact.html">Contact</a
          ><a href="/privacy.html">Privacy</a>
        </nav>
      </div>
    </header>
    <main class="tool">
      <div class="toolcard">
        <h1>📬 Contact Us</h1>
        <p class="sub">
          Questions, feedback or tool requests — we'd love to hear from you.
        </p>
        <!-- To make this form work, sign up free at formspree.io and replace YOUR_FORM_ID below -->
        <form id="contactForm" method="POST">
          <div class="row">
            <div>
              <label for="name">Name</label
              ><input id="name" name="name" required />
            </div>
            <div>
              <label for="email">Email</label
              ><input id="email" type="email" name="email" required />
            </div>
          </div>
          <label for="msg">Message</label
          ><textarea
            id="msg"
            name="message"
            rows="5"
            required
            style="width: 100%"
          ></textarea>
          <div
            class="form-status"
            aria-live="polite"
            style="margin-top: 12px; color: #1d4ed8"
          ></div>
          <button class="btn" style="margin-top: 14px" type="submit">
            Send Message
          </button>
        </form>
      </div>
    </main>
    <footer class="site">
      <div class="wrap">
        <div>© 2026 QuickCalc — Free online calculators & converters</div>
        <nav>
          <a href="/privacy.html">Privacy Policy</a> ·
          <a href="/about.html">About</a> · <a href="/contact.html">Contact</a>
        </nav>
      </div>
    </footer>
    <script defer src="assets/site.js"></script>
  </body>
</html>
